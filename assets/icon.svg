<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23c68b"/>
      <stop offset="1" stop-color="#7be3bd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#13342a"/>
      <stop offset="1" stop-color="#0c1014"/>
    </radialGradient>
    <radialGradient id="green" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#1f7a55"/>
      <stop offset="1" stop-color="#124d36"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect width="1024" height="1024" fill="#0c1014"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- putting green -->
  <ellipse cx="560" cy="650" rx="300" ry="120" fill="url(#green)" opacity="0.9"/>
  <ellipse cx="560" cy="650" rx="300" ry="120" fill="none" stroke="#2ee0a0" stroke-width="4" opacity="0.35"/>

  <!-- shot trajectory: dotted arc from lower-left up to the pin -->
  <path d="M 250 720 Q 430 300 604 512" fill="none" stroke="url(#emerald)"
        stroke-width="16" stroke-linecap="round" stroke-dasharray="2 40"/>
  <!-- ball at the start of the shot -->
  <circle cx="250" cy="720" r="24" fill="#f4f6f8"/>
  <circle cx="250" cy="720" r="24" fill="none" stroke="#23c68b" stroke-width="4" opacity="0.5"/>

  <!-- flagstick -->
  <rect x="596" y="300" width="14" height="360" rx="7" fill="#e8edf2"/>
  <!-- flag -->
  <path d="M 610 312 L 792 356 L 610 400 Z" fill="url(#emerald)"/>
  <!-- hole -->
  <ellipse cx="603" cy="662" rx="34" ry="13" fill="#0c1014" stroke="#2ee0a0" stroke-width="3" opacity="0.9"/>

  <!-- wordmark -->
  <text x="512" y="885" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800"
        font-size="150" letter-spacing="6" fill="#f4f6f8">TDP</text>
</svg>
